name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Add nuget to PATH
        uses: nuget/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Install SignTool
        run: |
          dotnet tool install --tool-path . --prerelease sign

      - name: Restore NuGet packages
        run: |
          nuget restore IceBuilder.sln

      - name: Build Extension
        run: |
          MSBuild IceBuilder.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Sign VSIX Package
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        run: |
          .\sign.exe code trusted-signing ".\IceBuilder\bin\Release\IceBuilder.vsix" `
            --trusted-signing-endpoint https://eus.codesigning.azure.net/ `
            --timestamp-url http://timestamp.acs.microsoft.com `
            --trusted-signing-account zeroc `
            --trusted-signing-certificate-profile zeroc-ice `
            --azure-key-vault-tenant-id ${{ env.AZURE_TENANT_ID }} `
            --azure-key-vault-client-id ${{ env.AZURE_CLIENT_ID }} `
            --azure-key-vault-client-secret ${{ env.AZURE_CLIENT_SECRET }}

      - name: Upload Extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IceBuilder
          path: |
            ./IceBuilder/bin/Release/*.vsix
